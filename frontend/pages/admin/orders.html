<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        .order-row { cursor: pointer; transition: background-color 0.2s; }
        .order-row:hover { background-color: var(--primary-light); }
        .invoice-print { font-family: monospace; }
        .invoice-table { width: 100%; text-align: left; margin-bottom: 1rem; border-collapse: collapse; }
        .invoice-table th, .invoice-table td { padding: 4px 0; border-bottom: 1px dashed #ccc; }
        @media print {
            body { background: #fff !important; color: #000 !important; margin: 0; padding: 0; }
            .app-container, .modal-header, .modal-footer, .toast-container { display: none !important; }
            .modal-overlay { display: none !important; }
            .modal-overlay.active { 
                position: static !important;
                background: transparent !important;
                padding: 0 !important;
                display: block !important;
            }
            .modal {
                box-shadow: none !important;
                border: 1px dashed #ccc !important;
                padding: 20px !important;
                max-width: 400px !important;
                width: 100% !important;
                margin: 20mm auto !important;
                max-height: none !important;
                overflow: visible !important;
                transform: none !important;
            }
            .modal-body {
                padding: 0 !important;
            }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>

            <div class="page-content">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                    <h1 class="page-title">Quản lý Đơn hàng & Hóa đơn</h1>
                    <a href="pos.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                        <i class="fa-solid fa-cash-register"></i> Bán hàng (POS)
                    </a>
                </div>

                <!-- Navigation Tabs -->
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem; border-bottom: 2px solid var(--border-color);">
                    <button class="tab-btn active" id="tab-online" onclick="OrderManager.switchTab('online')" style="padding: 10px 18px; font-weight: 600; border: none; background: transparent; cursor: pointer; border-bottom: 3px solid var(--primary-color); color: var(--primary-color); display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
                        <i class="fa-solid fa-globe"></i> Đơn hàng Online (Website)
                        <span class="badge badge-primary" id="badge-online-count" style="font-size: 0.75rem;">0</span>
                    </button>
                    <button class="tab-btn" id="tab-pos" onclick="OrderManager.switchTab('pos')" style="padding: 10px 18px; font-weight: 600; border: none; background: transparent; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
                        <i class="fa-solid fa-receipt"></i> Hóa đơn Bán tại quầy (POS)
                        <span class="badge badge-secondary" id="badge-pos-count" style="font-size: 0.75rem;">0</span>
                    </button>
                </div>

                <div class="card" style="margin-bottom: 1rem; padding: 1rem;">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <input type="text" id="search-order" class="form-control" placeholder="🔍 Tìm theo Mã đơn, Tên KH, SĐT..." style="flex: 1; min-width: 250px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px;">
                        <select id="filter-status" class="form-control" style="width: 220px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px;">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="MOI_TAO">Mới tạo</option>
                            <option value="DA_XAC_NHAN">Đã xác nhận</option>
                            <option value="DANG_GIAO">Đang giao</option>
                            <option value="YEU_CAU_HOAN_TIEN">Yêu cầu hoàn tiền</option>
                            <option value="HOAN_TAT">Hoàn tất</option>
                            <option value="HUY">Đã hủy / Đã hoàn tiền</option>
                        </select>
                        <select id="filter-payment" class="form-control" style="width: 200px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; display: none;">
                            <option value="">-- Tất cả PTTT --</option>
                            <option value="TIEN_MAT">Tiền mặt</option>
                            <option value="CHUYEN_KHOAN">Chuyển khoản</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr id="table-header-row">
                                    <th>Mã Đơn</th>
                                    <th>Ngày tạo</th>
                                    <th>Khách hàng</th>
                                    <th>Thu ngân</th>
                                    <th>Trạng thái</th>
                                    <th style="text-align: right;">Tổng tiền</th>
                                </tr>
                            </thead>
                            <tbody id="order-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    
    <div class="modal-overlay" id="order-modal">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">Chi tiết đơn hàng</span>
                <button class="modal-close" onclick="OrderManager.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="invoice-print" id="order-details-content">
                    
                </div>
            </div>
            <div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center;">
                <button class="btn btn-primary" id="btn-print-modal" style="display: inline-flex; align-items: center; gap: 6px;" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> In hóa đơn
                </button>
                <button class="btn btn-outline" onclick="OrderManager.closeModal()">Đóng</button>
            </div>
        </div>
    </div>

    <script src="../../js/storage.js"></script>
    <script src="../../js/mock-data.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/orders.js"></script>
    <script>
        Auth.requireAuth();
        if(!Auth.hasPermission('orders')) {
            window.location.href = 'dashboard.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderSidebar('orders');
            Layout.renderHeader('Đơn hàng');
            OrderManager.init();
        });
    </script>
</body>
</html>
