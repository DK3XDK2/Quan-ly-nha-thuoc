<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Quản lý Khách hàng</h1>
                    <button class="btn btn-primary" onclick="CustomerManager.openModal()">
                        <i class="fa-solid fa-plus"></i> Thêm khách hàng
                    </button>
                </div>

                <div class="card">
                    <div class="card-header" style="background-color: transparent;">
                        <div class="search-wrapper" style="position: relative; width: 300px;">
                            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 10px; color: var(--text-muted);"></i>
                            <input type="text" id="search-customer" class="form-control" style="padding-left: 2.5rem;" placeholder="Tìm theo tên, SĐT...">
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Mã KH</th>
                                    <th>Tên khách hàng</th>
                                    <th>Số điện thoại</th>
                                    <th>Email</th>
                                    <th>Số đơn hàng</th>
                                    <th>Địa chỉ</th>
                                    <th style="text-align: right;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="customer-list">
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    
    <div class="modal-overlay" id="customer-modal">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">Thêm khách hàng</span>
                <button class="modal-close" onclick="CustomerManager.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="customer-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label class="form-label">Tên khách hàng *</label>
                        <input type="text" id="c-name" class="form-control" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại *</label>
                        <input type="tel" id="c-phone" class="form-control" required placeholder="0901234567" pattern="[0-9]{10,11}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="c-email" class="form-control" placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" id="c-address" class="form-control" placeholder="Số nhà, đường, phường/xã, quận/huyện...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="CustomerManager.closeModal()">Hủy</button>
                <button class="btn btn-primary" onclick="CustomerManager.saveCustomer()"><i class="fa-solid fa-save"></i> Lưu khách hàng</button>
            </div>
        </div>
    </div>

    
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/customers.js"></script>
    <script>
        Auth.requireAuth();
        if(!Auth.hasPermission('customers')) {
            window.location.href = 'dashboard.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderSidebar('customers');
            Layout.renderHeader('Quản lý Khách hàng');
            CustomerManager.init();
        });
    </script>
</body>
</html>
