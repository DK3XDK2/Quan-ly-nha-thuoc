<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .filter-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            background: var(--bg-surface);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
        
        .report-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        @media (max-width: 1024px) {
            .report-grid {
                grid-template-columns: 1fr;
            }
        }
        
        
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .app-container, .app-main, .page-content { 
                height: auto !important; 
                overflow: visible !important; 
                display: block !important; 
            }
            .app-sidebar, .app-header, .filter-bar, .toast-container { display: none !important; }
            .app-main { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #fff !important; }
            .page-content { padding: 0 !important; max-width: 100% !important; }
            .card { 
                box-shadow: none !important; 
                border: 1px solid #ddd !important; 
                break-inside: avoid; 
                page-break-inside: avoid;
                margin-bottom: 1.5rem !important;
            }
            .report-grid { display: block !important; }
            .page-title { text-align: center; margin-bottom: 2rem !important; }
            
            div[style*="grid-template-columns: repeat"] {
                display: flex !important;
                flex-wrap: wrap !important;
            }
            div[style*="grid-template-columns: repeat"] > .card {
                flex: 1 1 45% !important;
                margin-right: 1rem !important;
            }
            .table-container { overflow: visible !important; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Báo cáo Kinh doanh</h1>
                </div>

                <div class="filter-bar">
                    <select class="form-control" style="width: 200px;" id="report-period">
                        <option value="today">Hôm nay</option>
                        <option value="7days" selected>7 ngày qua</option>
                        <option value="thismonth">Tháng này</option>
                        <option value="all">Tất cả thời gian</option>
                    </select>
                    <button class="btn btn-primary" onclick="Reports.generate()"><i class="fa-solid fa-filter"></i> Lọc báo cáo</button>
                    <div class="dropdown" style="margin-left: auto; position: relative; display: inline-block;">
                        <button class="btn btn-outline" onclick="Reports.toggleExportMenu(event)">
                            <i class="fa-solid fa-file-export"></i> Xuất Báo Cáo <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; margin-left: 4px;"></i>
                        </button>
                        <div id="export-menu" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 6px; background: white; border: 1px solid #e2e8f0; border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 1000; min-width: 190px; overflow: hidden;">
                            <a href="#" onclick="Reports.exportPDF(event)" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                                <i class="fa-solid fa-file-pdf" style="color: #ef4444; font-size: 1.1rem;"></i> Tải file PDF (.pdf)
                            </a>
                            <a href="#" onclick="Reports.exportCSV(event)" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; border-top: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                                <i class="fa-solid fa-file-excel" style="color: #10b981; font-size: 1.1rem;"></i> Tải file Excel (.csv)
                            </a>
                            <a href="#" onclick="Reports.exportWord(event)" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; border-top: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                                <i class="fa-solid fa-file-word" style="color: #2563eb; font-size: 1.1rem;"></i> Tải file Word (.doc)
                            </a>
                            <a href="#" onclick="Reports.exportJSON(event)" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; border-top: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                                <i class="fa-solid fa-file-code" style="color: #8b5cf6; font-size: 1.1rem;"></i> Tải file JSON (.json)
                            </a>
                            <a href="#" onclick="Reports.printReport(event)" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; border-top: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                                <i class="fa-solid fa-print" style="color: #64748b; font-size: 1.1rem;"></i> In trực tiếp (Print)
                            </a>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--spacing-md); margin-bottom: var(--spacing-lg);">
                    <div class="card card-body">
                        <div class="text-secondary">Tổng doanh thu</div>
                        <h2 style="font-size: 1.5rem; margin-top: 0.5rem; color: var(--primary-color);" id="rep-revenue">0 ₫</h2>
                    </div>
                    <div class="card card-body">
                        <div class="text-secondary">Lợi nhuận (ước tính 30%)</div>
                        <h2 style="font-size: 1.5rem; margin-top: 0.5rem; color: var(--success-color);" id="rep-profit">0 ₫</h2>
                    </div>
                    <div class="card card-body">
                        <div class="text-secondary">Số đơn hàng</div>
                        <h2 style="font-size: 1.5rem; margin-top: 0.5rem;" id="rep-orders">0</h2>
                    </div>
                    <div class="card card-body">
                        <div class="text-secondary">Sản phẩm đã bán</div>
                        <h2 style="font-size: 1.5rem; margin-top: 0.5rem;" id="rep-items">0</h2>
                    </div>
                </div>

                <div class="report-grid">
                    <div class="card">
                        <div class="card-header">Biểu đồ doanh thu</div>
                        <div class="card-body">
                            <canvas id="revenueChart" height="120"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">Top Sản phẩm bán chạy</div>
                        <div class="table-container">
                            <table class="table" style="font-size: 0.875rem;">
                                <thead>
                                    <tr>
                                        <th>Sản phẩm</th>
                                        <th style="text-align: right;">SL Bán</th>
                                    </tr>
                                </thead>
                                <tbody id="rep-top-products">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/reports.js"></script>
    <script>
        Auth.requireAuth();
        if(!Auth.hasPermission('reports')) {
            window.location.href = 'dashboard.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderSidebar('reports');
            Layout.renderHeader('Báo cáo');
            Reports.init();
        });
    </script>
</body>
</html>
