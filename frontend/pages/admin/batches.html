<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lô Hàng - AINA Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="app-sidebar"></aside>
        <main class="main-content">
            <header class="header" id="app-header"></header>
            
            <div class="content-area">
                <div class="page-header">
                    <h2>Danh sách Lô hàng</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="showAddBatchModal()"><i class="fa-solid fa-plus"></i> Thêm lô mới</button>
                    </div>
                </div>

                <div class="card">
                    <div class="table-toolbar">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                            <input type="text" id="search-batch" class="search-input" placeholder="Tìm theo mã lô hoặc tên sản phẩm..." onkeyup="filterBatches()">
                        </div>
                        <div class="filter-actions">
                            <select class="form-select" id="filter-status" onchange="filterBatches()">
                                <option value="all">Tất cả trạng thái</option>
                                <option value="ACTIVE">Còn hạn</option>
                                <option value="EXPIRING">Sắp hết hạn (< 30 ngày)</option>
                                <option value="EXPIRED">Đã hết hạn</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table" id="batches-table">
                            <thead>
                                <tr>
                                    <th>Mã Lô</th>
                                    <th>Sản phẩm</th>
                                    <th>Tồn kho</th>
                                    <th>Ngày SX</th>
                                    <th>Hạn SD</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="batches-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Thêm/Sửa Lô -->
    <div id="modal-batch" class="modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9000; justify-content:center; align-items:center;">
        <div style="background:var(--bg-surface); padding:2rem; border-radius:8px; width:500px; max-width:90%;">
            <h3 id="modal-batch-title" style="margin-top:0; margin-bottom:1.5rem;">Thêm lô hàng</h3>
            <form id="form-batch" onsubmit="saveBatch(event)">
                <input type="hidden" id="batch-old-id">
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Mã Lô *</label>
                    <input type="text" id="batch-id" required style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:4px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Sản phẩm *</label>
                    <select id="batch-product" required style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:4px;"></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div>
                        <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Ngày SX *</label>
                        <input type="date" id="batch-mfg" required style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:4px;">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Hạn SD *</label>
                        <input type="date" id="batch-exp" required style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:4px;">
                    </div>
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Số lượng (Tồn) *</label>
                    <input type="number" id="batch-qty" required min="0" style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn-outline modal-close" onclick="App.hideModal('modal-batch')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/storage.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.requireAuth();
            Layout.renderSidebar('inventory');
            Layout.renderHeader('Quản lý lô hàng');
            loadBatches();
            populateProductSelect();
        });

        async function populateProductSelect() {
            const products = await API.get('/api/thuoc').catch(() => Storage.get('products') || []);
            const select = document.getElementById('batch-product');
            select.innerHTML = '<option value="">-- Chọn sản phẩm --</option>' + products.map(p => `<option value="${p.id || p.maThuoc}">${p.tenThuoc || p.name}</option>`).join('');
        }

        async function loadBatches() {
            App.showLoading();
            let batches = [];
            try {
                const res = await API.get('/api/ton-kho/lo?limit=100');
                batches = Array.isArray(res) ? res : (res.danhSach || []);
            } catch (e) {
                batches = Storage.get('batches') || [];
            }
            window.allBatches = batches;
            renderTable(batches);
            App.hideLoading();
        }

        function filterBatches() {
            let batches = window.allBatches || [];
            const search = document.getElementById('search-batch').value.toLowerCase().trim();
            const statusFilter = document.getElementById('filter-status').value;
            const today = new Date();

            if (search) {
                batches = batches.filter(b => {
                    const code = (b.soLo || b.id || '').toString().toLowerCase();
                    const name = (b.thuoc?.tenThuoc || b.productName || '').toLowerCase();
                    return code.includes(search) || name.includes(search);
                });
            }

            if (statusFilter !== 'all') {
                batches = batches.filter(b => {
                    let bStatus = b.status;
                    if (!bStatus && (b.hanSuDung || b.expiryDate)) {
                        const expDate = new Date(b.hanSuDung || b.expiryDate);
                        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                        if (diffDays < 0) bStatus = 'EXPIRED';
                        else if (diffDays <= 30) bStatus = 'EXPIRING';
                        else bStatus = 'ACTIVE';
                    }
                    return bStatus === statusFilter;
                });
            }
            renderTable(batches);
        }

        function renderTable(batches) {
            const tbody = document.getElementById('batches-tbody');
            if (!batches || batches.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:2rem; color:var(--text-muted);">Không tìm thấy lô hàng nào.</td></tr>`;
                return;
            }

            const today = new Date();
            let html = '';
            batches.forEach(b => {
                const batchCode = b.soLo || b.id || 'N/A';
                const productName = b.thuoc?.tenThuoc || b.productName || 'Sản phẩm';
                const qty = Number(b.soLuongTon ?? b.quantity ?? 0);
                const mfg = b.manufacturingDate || (b.taoLuc ? new Date(b.taoLuc).toLocaleDateString('vi-VN') : '-');
                
                let expFormatted = '-';
                let bStatus = b.status || 'ACTIVE';

                if (b.hanSuDung || b.expiryDate) {
                    const expDate = new Date(b.hanSuDung || b.expiryDate);
                    expFormatted = expDate.toLocaleDateString('vi-VN');
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) bStatus = 'EXPIRED';
                    else if (diffDays <= 30) bStatus = 'EXPIRING';
                    else bStatus = 'ACTIVE';
                }

                let statusBadge = `<span class="badge badge-success">Còn hạn</span>`;
                if (bStatus === 'EXPIRED') statusBadge = `<span class="badge badge-danger">Hết hạn</span>`;
                if (bStatus === 'EXPIRING') statusBadge = `<span class="badge badge-warning">Sắp hết hạn</span>`;

                html += `
                    <tr>
                        <td style="font-weight:600; font-family: monospace;">${batchCode}</td>
                        <td>${productName}</td>
                        <td style="font-weight:600;">${qty.toLocaleString('vi-VN')}</td>
                        <td>${mfg}</td>
                        <td style="font-weight:600; color: ${bStatus === 'EXPIRED' ? 'var(--danger-color)' : 'inherit'}">${expFormatted}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-icon" onclick="editBatch('${b.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon text-danger" onclick="deleteBatch('${b.id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function showAddBatchModal() {
            document.getElementById('modal-batch-title').innerText = 'Thêm lô hàng';
            document.getElementById('form-batch').reset();
            document.getElementById('batch-old-id').value = '';
            App.showModal('modal-batch');
        }

        function editBatch(id) {
            const batches = window.allBatches || Storage.get('batches') || [];
            const b = batches.find(x => x.id == id);
            if(!b) return;

            document.getElementById('modal-batch-title').innerText = 'Cập nhật lô hàng';
            document.getElementById('batch-old-id').value = b.id;
            document.getElementById('batch-id').value = b.soLo || b.id;
            document.getElementById('batch-product').value = b.thuocId || b.productId;
            document.getElementById('batch-mfg').value = b.manufacturingDate || (b.taoLuc ? b.taoLuc.split('T')[0] : '');
            document.getElementById('batch-exp').value = b.hanSuDung ? b.hanSuDung.split('T')[0] : (b.expiryDate || '');
            document.getElementById('batch-qty').value = b.soLuongTon ?? b.quantity ?? 0;
            App.showModal('modal-batch');
        }

        function saveBatch(e) {
            e.preventDefault();
            const id = document.getElementById('batch-id').value.trim();
            const oldId = document.getElementById('batch-old-id').value;
            const productId = document.getElementById('batch-product').value;
            const productName = document.getElementById('batch-product').options[document.getElementById('batch-product').selectedIndex].text;
            const mfg = document.getElementById('batch-mfg').value;
            const exp = document.getElementById('batch-exp').value;
            const qty = parseInt(document.getElementById('batch-qty').value);

            App.showLoading();
            setTimeout(() => {
                let batches = window.allBatches || Storage.get('batches') || [];

                const today = new Date();
                const expDate = new Date(exp);
                const diffTime = expDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let status = 'ACTIVE';
                if(diffDays < 0) status = 'EXPIRED';
                else if(diffDays <= 30) status = 'EXPIRING';

                const newBatch = {
                    id: id,
                    soLo: id,
                    thuocId: productId,
                    productId: productId,
                    productName: productName,
                    manufacturingDate: mfg,
                    hanSuDung: exp,
                    expiryDate: exp,
                    soLuongTon: qty,
                    quantity: qty,
                    status: status
                };

                if(oldId) {
                    const idx = batches.findIndex(x => x.id == oldId);
                    if(idx !== -1) batches[idx] = newBatch;
                } else {
                    batches.push(newBatch);
                }

                Storage.set('batches', batches);
                
                App.hideLoading();
                App.hideModal('modal-batch');
                App.showToast('Lưu lô hàng thành công!', 'success');
                filterBatches();
            }, 500);
        }

        function deleteBatch(id) {
            App.showConfirm('Bạn có chắc chắn muốn xóa lô hàng này?', () => {
                let batches = window.allBatches || Storage.get('batches') || [];
                batches = batches.filter(x => x.id != id);
                Storage.set('batches', batches);
                App.showToast('Đã xóa lô hàng!', 'success');
                filterBatches();
            });
        }
    </script>
</body>
</html>
