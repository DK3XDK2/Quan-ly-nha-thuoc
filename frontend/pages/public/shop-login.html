<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/shop.css">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 2rem;
        }
        .auth-container {
            background: var(--shop-surface);
            width: 100%;
            max-width: 450px;
            border-radius: var(--shop-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2.5rem;
            border: 1px solid var(--shop-border);
        }
        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--shop-primary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--shop-text);
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--shop-border);
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--shop-primary);
        }
        .btn-auth {
            width: 100%;
            background: var(--shop-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-auth:hover {
            background: var(--shop-secondary);
        }
        .auth-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .auth-links a {
            color: var(--shop-primary);
            text-decoration: none;
            cursor: pointer;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .d-none {
            display: none !important;
        }
    </style>
</head>
<body class="shop-layout">

    <header class="shop-header">
        <div class="shop-header-top" style="justify-content: center;">
            <a href="index.html" class="shop-logo"><img src="../../assets/images/ainalogo.png" class="shop-logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8687/8687597.png'" alt="Logo">
                <div class="shop-logo-text">
                    <span class="shop-logo-top">NHÀ THUỐC</span>
                    <span class="shop-logo-bottom">AINA</span>
                </div></a>
        </div>
    </header>

    <div class="auth-wrapper">
        
        <div class="auth-container" id="login-form">
            <h2 class="auth-title">Đăng nhập Khách hàng</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="login-email" required placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" class="form-control" id="login-pw" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn-auth">Đăng nhập</button>
                <div class="auth-links">
                    <a onclick="switchForm('register-form')">Đăng ký tài khoản mới</a>
                </div>
                <div style="margin-top: 1.5rem; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px dashed #cbd5e1; font-size: 0.85rem; text-align: left;">
                    <p style="font-weight: 600; color: #475569; margin-bottom: 6px;"><i class="fa-solid fa-key"></i> Tài khoản mẫu chấm bài / demo:</p>
                    <div style="cursor: pointer; color: var(--shop-primary); margin-bottom: 4px;" onclick="fillCustomerDemo('khachhang1@gmail.com', '123456')">
                        👉 <strong>khachhang1@gmail.com</strong> / <code>123456</code> <span style="font-size:0.75rem; color:#64748b;">(Bấm để điền)</span>
                    </div>
                </div>
            </form>
        </div>

        
        <div class="auth-container d-none" id="register-form">
            <h2 class="auth-title">Đăng ký tài khoản Khách hàng</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" class="form-control" id="reg-name" required placeholder="Nhập họ và tên">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="reg-email" required placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" class="form-control" id="reg-phone" required placeholder="Nhập số điện thoại (10-11 số)">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" class="form-control" id="reg-pw" required placeholder="Tạo mật khẩu (Ít nhất 6 ký tự)">
                </div>
                <button type="submit" class="btn-auth">Đăng ký</button>
                <div class="auth-links" style="justify-content: center;">
                    <span style="color: var(--shop-text-muted);">Đã có tài khoản? </span>&nbsp;<a onclick="switchForm('login-form')">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        function switchForm(formId) {
            document.getElementById('login-form').classList.add('d-none');
            document.getElementById('register-form').classList.add('d-none');
            document.getElementById(formId).classList.remove('d-none');
        }

        function fillCustomerDemo(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-pw').value = pass;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pw').value;

            const ok = await Auth.loginCustomer(email, password);
            if (ok) {
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-pw').value;

            const ok = await Auth.registerCustomer({ name, email, phone, password });
            if (ok) {
                switchForm('login-form');
                document.getElementById('login-email').value = email;
            }
        }
    </script>
</body>
</html>
